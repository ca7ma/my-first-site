<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My First Site</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 2rem;
      background-color: #000;
      box-shadow: 0 0 10px rgba(255,255,255,0.1);
    }

    .logo {
      font-weight: bold;
      font-size: 1.2rem;
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .logo:hover {
      transform: scale(1.1);
    }

    nav a {
      margin-left: 20px;
      color: #fff;
      text-decoration: none;
      position: relative;
      transition: color 0.3s;
    }

    nav a::after {
      content: '';
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -3px;
      left: 0;
      background-color: white;
      transition: width 0.3s;
    }

    nav a:hover {
      color: #ccc;
    }

    nav a:hover::after {
      width: 100%;
    }

    .main {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .main h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    .btn {
      margin-top: 2rem;
      padding: 0.75rem 2rem;
      background-color: #fff;
      color: #000;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: transform 0.3s, background-color 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      background-color: #ccc;
    }

    #video-container {
      display: none;
      margin-top: 2rem;
    }

    video {
      width: 80vw;
      max-width: 800px;
      border: 3px solid white;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo" onclick="scrollToTop()">Home</div>
    <nav>
      <a href="https://t.me/FannerrXC" target="_blank">Support</a>
      <a href="#" onclick="showAbout()">About</a>
    </nav>
  </header>

  <div class="main">
    <h1>Welcome to My First Website</h1>
    <button class="btn" onclick="playVideo()">Get Started</button>
    <div id="video-container">
      <video id="intro-video" controls>
        <source src="video.mp4" type="video/mp4" />
        Your browser does not support the video tag.
      </video>
    </div>
  </div>

  <script>
    function playVideo() {
      const videoContainer = document.getElementById("video-container");
      const video = document.getElementById("intro-video");
      videoContainer.style.display = "block";
      video.play();
    }

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function showAbout() {
      alert("This website is a minimalist landing page created as your first web project. It features animations, dark theme, and a simple video introduction.");
    }
  </script>
</body>
</html>
